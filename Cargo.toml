[workspace]
resolver = "2"
members = [
    "crates/sardown-ast",
    "crates/sardown-enrich",
    "crates/sardown-layout",
    "crates/sardown-pdf",
    "crates/sardown-cli",
    "crates/sardown-book",
    "crates/sardown-style",
    "crates/sardown-slides",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/abbra/sardown"

# CI runs plain `cargo clippy` (scripts/local-ci.sh); encoding the lint level here means a
# clippy warning fails the build in-tree, without anyone having to remember `-D warnings`.
[workspace.lints.clippy]
all = "deny"
