[package]
name = "sardown-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["png"]
# PNG output (`-o page.png`): renders the finished PDF with hayro.
png = ["dep:hayro"]
# Ondine as an alternative Mermaid renderer; pulls a git dependency, so it is off by default.
ondine = ["sardown-enrich/ondine"]

[[bin]]
name = "sardown"
path = "src/main.rs"

[[bench]]
name = "render"
harness = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
cosmic-text = "0.19.0"
fontdb = "0.23"
ttf-parser = "0.25"
hayro = { version = "0.8", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
sardown-ast = { path = "../sardown-ast" }
sardown-book = { version = "0.1.0", path = "../sardown-book" }
sardown-enrich = { version = "0.1.0", path = "../sardown-enrich" }
sardown-layout = { path = "../sardown-layout" }
sardown-pdf = { version = "0.1.0", path = "../sardown-pdf" }
sardown-slides = { version = "0.1.0", path = "../sardown-slides" }
sardown-style = { version = "0.1.0", path = "../sardown-style" }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
lopdf = "0.44.0"
pdfium-render = "0.9.3"
proptest = "1.11.0"
