[package]
name = "md2pdf-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "md2pdf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
md2pdf-ast = { path = "../md2pdf-ast" }
md2pdf-layout = { path = "../md2pdf-layout" }
md2pdf-pdf = { path = "../md2pdf-pdf" }

[dev-dependencies]
assert_cmd = "2.2.2"
