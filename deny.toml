# cargo-deny configuration -- see https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained; no safe upgrade exists (transitive via hyphenation/syntect)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 is unmaintained; no safe upgrade exists (transitive via krilla/usvg)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is unmaintained; no safe upgrade exists (transitive via fontdb/cosmic-text)" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust 0.4.5 is unmaintained; no safe upgrade exists (transitive via syntect)" },
]

[licenses]
# Every license actually present in the dependency tree, verified against `cargo metadata`.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
