# A5, for booklet-style documents -- half an A4 sheet, a common European convention for
# pamphlets and small booklets. Uses the same EU/international styling as eu-a4.toml, with a
# smaller body size appropriate to the smaller page, alongside the already-tighter 15mm
# margin.
#
# font_family is now rendered. If a named font isn't available as a loaded, matchable font
# on the machine running md2pdf, it falls back to a generic sans-serif font with a warning on
# stderr rather than failing the render.

[page]
format = "a5"
margin_mm = 15.0

[typography]
font_family = "Helvetica"
body_size_pt = 10.0

[heading]
font_family = "Helvetica"
color = "#2c3e50"

[footer]
enabled = true
font_family = "Helvetica"
font_size_pt = 8.0
suppress_on_chapter_start = false

[footer.uniform]
right = "{page} / {total_pages}"
