# US Legal, with the standard 1-inch (25.4mm) margin, styled with the same US typographic
# tradition as us-letter.toml but using the "Page X of Y" footer convention common in legal
# filings and contracts rather than a bare page number. Shown on every page including the
# first, for the same reason as us-letter.toml.
#
# font_family is recorded as intended styling but not yet rendered -- see us-letter.toml's
# comment for details.

[page]
format = "legal"
margin_mm = 25.4

[typography]
font_family = "Times New Roman"
body_size_pt = 12.0

[heading]
font_family = "Times New Roman"

[footer]
enabled = true
font_family = "Times New Roman"
font_size_pt = 9.0
suppress_on_chapter_start = false

[footer.uniform]
center = "Page {page} of {total_pages}"
