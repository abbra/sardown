# US Letter, with the standard 1-inch (25.4mm) margin used by US business and academic
# documents (e.g. the default in Microsoft Word and most US style guides), styled with the
# typographic conventions common to US academic and business writing: a serif body face,
# 12pt text, and a plain page number centered in the footer of every page (including the
# first -- suppress_on_chapter_start is turned off below since a single business/academic
# document isn't structured into book-style chapters with their own opening-page convention).
#
# font_family values are now rendered. If a named font (e.g. "Times New Roman", "Garamond")
# isn't available as a loaded, matchable font on the machine running md2pdf, it falls back to a
# generic sans-serif font with a warning on stderr, rather than failing the render.

[page]
format = "letter"
margin_mm = 25.4

[typography]
font_family = "Times New Roman"
body_size_pt = 12.0

[heading]
font_family = "Times New Roman"

[footer]
enabled = true
font_family = "Times New Roman"
font_size_pt = 9.0
suppress_on_chapter_start = false

[footer.uniform]
center = "{page}"
